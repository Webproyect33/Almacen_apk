name: Compilar APK Android

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Generar APK de Broters_Almacen
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir archivo ZIP si existe
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Descomprimiendo archivo .zip..."
            unzip -o *.zip
            rm -f *.zip || true
          fi

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17 (Estándar para Android 34)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Instalar dependencias del proyecto
        run: npm install

      - name: Compilar aplicación web
        run: npm run build

      - name: Instalar Capacitor 6 Android (Compatible y Estable)
        run: |
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          npx cap add android || true
          npx cap sync android

      - name: Compilar APK Android
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> gradle.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar archivo APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Broters_Almacen-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
