name: Compilar APK Android

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Generar APK de Broters_Almacen
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir archivo ZIP
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Descomprimiendo archivo .zip..."
            unzip -o *.zip
            rm -f *.zip || true
          else
            echo "Sin archivo .zip adicional, continuando..."
          fi

      - name: Configurar Node.js en la nube
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Aceptar licencias del SDK de Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Instalar librerías
        run: npm install

      - name: Compilar aplicación web
        run: npm run build

      - name: Configurar Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap sync android

      - name: Compilar APK Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar archivo APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Broters_Almacen-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
